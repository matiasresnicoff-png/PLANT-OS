<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <main class="wireframe">
        <section class="inicio">
            <header class="header-arriba">
                <section class="icono-registro">
                    <button id="flecha" onclick="history.back()" style="background: none; border: none; padding: 0; cursor: pointer;">
                        <img style="width: 1.875rem; height: 1.875rem;" src="./src/img/flecha.png" alt="Flecha"/>
                    </button>
                </section>
            </header>

                <section class="centro-titulos">
                    <h1 class="title">Inicio</h1>
                    <h2 class="title2">¡Bienvenido, <span id="nombre-usuario-inicio">Usuario</span>!</h2>
                </section>

            <section class="circulo-inicio">
                <img src="./src/img/planta5.png" alt="Mi perfil" />
                <p class="title3">Salud general</p>
                <p class="title4">Estado óptimo</p>
            </section>

            <section class="tarjetas-inicio">
                <a class="tarjeta-inicio" href="8. conductividad.html">
                    <img class="simbolo" src="./src/img/conductividad.png" />
                    <p class="titulo">Conductividad del suelo</p>
                    <p class="medida">1.4 dS/m</p>
                    <p class="conclucion">¡Rango Saludable!</p>
                </a>
                <a class="tarjeta-inicio" href="7. temperatura.html">
                    <img class="simbolo" src="./src/img/temperatura.png" />
                    <p class="titulo">Temperatura</p>
                    <p class="medida">21.5 °C</p>
                    <p class="conclucion">¡Perfecto!</p>
                </a>
                <a class="tarjeta-inicio" href="6. humedad.html">
                    <img class="simbolo" src="./src/img/humedad.png" />
                    <p class="titulo">Humedad del suelo</p>
                    <p class="medida">72%</p>
                    <p class="conclucion">¡Ideal!</p>
                </a>
            </section>

            <button class="cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>

            <section class="barra-navegacion">
                <a class="opcion-navegacion" href="5. inicio.html">
                    <p class="opcion-navegacion">Inicio</p>
                    <img class="emojis" src="./src/img/casita.png" />
                </a>
                <a class="opcion-navegacion" href="9. acerca-plantos.html">
                    <p class="opcion-navegacion">Acerca de PlantOS</p>
                    <img class="emojis" src="./src/img/arbol.png" />
                </a>
                <a class="opcion-navegacion" href="10. perfil.html">
                    <p class="opcion-navegacion">Perfil</p>
                    <img class="emojis" src="./src/img/personita.png" />
                </a>
            </section>
        </section>
    </main>

    <script src="src/inicio.js" defer></script>
</body>
</html>
