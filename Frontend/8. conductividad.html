<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle conductividad - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
</head>
<body>
    <div class="wireframe">
        <div class="detalle-conductividad">
            <div class="icono-registro"></div>
            <div class="perfil-conductividad"></div>
            <div class="titulo-conductividad"></div>
            <div class="tarjeta-estado">
                <div class="dato-estado"></div>
                <div class="valor-estado"></div>
            </div>
            <div class="subtitulo-conductividad"></div>
            <div class="grafico-conductividad">
                <div class="grafico-interior"></div>
            </div>
            <div class="texto-grafico"></div>
            <div class="tarjeta-informacion">
                <div class="informacion-interior"></div>
            </div>
            <div class="barra-navegacion">
                <div class="icono-navegacion"></div>
                <div class="opcion-navegacion opcion-centro"></div>
                <div class="opcion-navegacion opcion-izquierda"></div>
                <div class="opcion-navegacion opcion-derecha"></div>
            </div>
        </div>
    </div>
</body>
</html>
