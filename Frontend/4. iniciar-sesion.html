<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
</head>
<body>
    <main class="wireframe">
        <section class="iniciar-sesion">
            <section class="icono-registro"></section>
            <section class="logo-login"></section>
            <section class="titulo-login"></section>
            <section class="imagen-login"></section>
            <section class="campo-login">
                <section class="etiqueta-login"></section>
                <input class="input-login" id="input-mail-login" type="email" placeholder="Mail">
            </section>
            <section class="campo-login">
                <section class="etiqueta-login"></section>
                <input class="input-login" id="input-contrasena-login" type="password" placeholder="Contraseña">
                <section class="input-login"></section>
            </section>
            <section class="texto-login"></section>
            <section class="texto-login"></section>
        </section>
    </main>

    <script src="src/login.js" defer></script>
</body>
</html>
