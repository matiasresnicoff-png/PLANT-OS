<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Humedad - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
</head>
<body>
    <div class="wireframe">
        <div class="detalle-humedad">
            
            <div class="titulo-humedad"></div>
            <div class="tarjeta-estado">
                <div class="dato-estado" id="estado-humedad"></div>
                <div class="valor-estado" id="valor-humedad"></div>
                <div class="subtitulo-humedad"></div>
            </div>
            <div class="subtitulo-humedad"></div>
            <div class="grafico-humedad">
                <div class="grafico-interior" id="grafico-humedad"></div>
            </div>
            <div class="tarjeta-informacion">
                <div class="informacion-interior" id="recomendacion-humedad"></div>
            </div>
            <div class="barra-navegacion">
                <div class="icono-navegacion"></div>
                <div class="opcion-izquierda"></div>
                <div class="opcion-centro"></div>
                <div class="opcion-derecha"></div>
            </div>
        </div>
    </div>

    <script src="src/humedad.js" defer></script>
</body>
</html>
