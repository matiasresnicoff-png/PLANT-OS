<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="wireframe">
        <section class="mi-perfil">
             <header class="header-superior">
             <section class="icono-registro">
                <button onclick="location.href='5. inicio.html'" style="background: none; border: none; padding: 0; cursor: pointer;">
                    <img src="./src/img/flecha.png" alt="Volver" style="width: 1.875rem; height: 1.875rem;"/>
                </button>
             </section>
             <img class="LOGO" src="./src/img/plantos-icon.png" alt="PlantOS" />
            </header>
            <div class="foto-perfil avatar-inicial" id="avatar-perfil-letra"></div>
            <section class="nombre-perfil" id="nombre-perfil-valor"></section>
            <section class="descripcion-perfil">Cuenta de PlantOS</section>
            <section class="tarjeta-datos-perfil">
                <section class="campo-perfil">
                    <label for="input-nombre-perfil">Nombre</label>
                    <input class="dato-perfil" id="input-nombre-perfil" type="text">
                </section>
                <section class="campo-perfil">
                    <label for="input-fecha-perfil">Fecha de nacimiento</label>
                    <input class="dato-perfil" id="input-fecha-perfil" type="date">
                </section>
                <section class="campo-perfil">
                    <label for="input-mail-perfil">Correo electrónico</label>
                    <input class="dato-perfil" id="input-mail-perfil" type="email">
                </section>
            </section>
            <section class="tarjeta-extra-perfil">
                <section class="contenido-extra-perfil" id="boton-guardar-perfil" style="cursor: pointer;"></section>
            </section>
            <section class="barra-navegacion">
                <a class="opcion-navegacion" href="5. inicio.html">
                    <svg class="icono-navegacion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
                    Inicio
                </a>
                <a class="opcion-navegacion" href="9. acerca-plantos.html">
                    <svg class="icono-navegacion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="0.5" fill="currentColor" stroke="none"/></svg>
                    Acerca de
                </a>
                <a class="opcion-navegacion activo" href="10. perfil.html">
                    <svg class="icono-navegacion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                    Perfil
                </a>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="src/toast.js" defer></script>
    <script src="src/perfil.js" defer></script>
</body>
</html>
