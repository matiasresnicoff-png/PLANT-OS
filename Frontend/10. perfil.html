<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
</head>
<body>
    <main class="wireframe">
        <section class="mi-perfil">
             <header class="header-superior">
             <section class="icono-registro"></section>
            </header>
            <section class="foto-perfil"></section>
            <section class="nombre-perfil" id="nombre-perfil-valor"></section>
            <section class="descripcion-perfil"></section>
            <section class="tarjeta-datos-perfil">
                <input class="dato-perfil" id="input-nombre-perfil" type="text">
                <input class="dato-perfil" id="input-fecha-perfil" type="date">
                <input class="dato-perfil" id="input-mail-perfil" type="email">
            </section>
            <section class="tarjeta-extra-perfil">
                <section class="contenido-extra-perfil" id="boton-guardar-perfil" style="cursor: pointer;"></section>
            </section>
            <section class="barra-navegacion">
                <section class="icono-navegacion"></section>
                <section class=" opcion-izquierda"></section>
                <section class=" opcion-centro"></section>
                <section class=" opcion-derecha"></section>
            </section>
            </section>
    </main>

    <script src="src/perfil.js" defer></script>
</body>
</html>
