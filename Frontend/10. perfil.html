<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="wireframe">
        <section class="mi-perfil">
             <header class="header-superior">
                 <section class="icono-registro">
                    <button onclick="location.href='5. inicio.html'" style="background: none; border: none; padding: 0; cursor: pointer;">
                        <img src="./src/img/flecha.png" alt="Volver" style="width: 1.875rem; height: 1.875rem;"/>
                    </button>
                 </section>
            </header>

            <div class="foto-perfil avatar-inicial" id="avatar-perfil-letra"></div>
            <section class="nombre-perfil" id="nombre-perfil-valor"></section>
            <section class="descripcion-perfil" id="mail-perfil-valor"></section>
            
            <section class="tarjeta-datos-perfil">
                <section class="campo-perfil">
                    <label class="input" for="input-nombre-registro">Nombre</label>
                    <input class="dato-perfil" id="input-nombre-registro" type="text">
                </section>
                <section class="campo-perfil">
                    <label class="input" for="input-fecha-registro">Fecha de nacimiento</label>
                    <input class="dato-perfil" id="input-fecha-registro" type="date">
                </section>
                <section class="campo-perfil">
                    <label class="input" for="input-mail-registro">Correo electrónico</label>
                    <input class="dato-perfil" id="input-mail-registro" type="email">
                </section>
            </section>
            <button id="boton-guardar-perfil" class="btn-guardar" style="margin-top: 1rem; cursor: pointer;">Editar datos personales</button>
            <section class="barra-navegacion">
                <a class="opcion-navegacion" href="5. inicio.html">
                    <p class="opcion-navegacion">Inicio</p>
                    <img class="emojis" src="./src/img/casita.png" />
                </a>
                <a class="opcion-navegacion" href="9. acerca-plantos.html">
                    <p class="opcion-navegacion">Acerca de PlantOS</p>
                    <img class="emojis" src="./src/img/arbol.png" />
                </a>
                <a class="opcion-navegacion" href="10. perfil.html">
                    <p class="opcion-navegacion">Perfil</p>
                    <img class="emojis" src="./src/img/personita.png" />
                </a>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="src/toast.js" defer></script>
    <script src="src/api.js" defer></script>
    <script src="src/perfil.js" defer></script>
</body>
</html>
