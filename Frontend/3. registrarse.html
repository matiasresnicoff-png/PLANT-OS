<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
</head>
<body>
    <main class="wireframe">
        <section class="registrarse">
            <section class="icono-registro">
                <button id="flecha" onclick="location.href='2. index.html'" style="background: none; border: none; padding: 0; cursor: pointer;">
                    <img style="width: 1.875rem; height: 1.875rem;" src="./src/img/flecha.png" alt="Flecha"/>
                </button>
            </section>            
            <section class="logo-registrarse">
                <img style="width: 10.25rem; height: 9.75rem" src="./src/img/PLANTA.png" />
            </section>
            <section class="titulo-registrarse">
                <p>El sistema operativo de las plantas</p>
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Nombre</p>
                </section>
                <section class="input-registro">
                    <p>Ej: Matías</p>
                </section>
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Fecha de nacimiento</p>
                </section>
                <section class="input-registro">
                    <p>DD/MM/AAAA</p>
                </section>
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Correo electrónico</p>
                </section>
                <section class="input-registro">
                    <p>ejemplo@gmail.com</p>
                </section>
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Contraseña</p>
                </section>
                <section class="input-registro">
                    <p>••••••••</p>
                </section>
            </section>
            <section class="boton-registro">
                <button class="Registrarme">Registrarme</button>
            </section>
            <section class="texto-registro">
                <p>¿Ya tenés cuenta? <a href="4. iniciar-sesion.html">Iniciá sesión</a></p>
            </section>
        </section>
    </main>
</body>
</html>
