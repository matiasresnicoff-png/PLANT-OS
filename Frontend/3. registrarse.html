<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - plantOS</title>
    <link rel="stylesheet" href="PlantOS.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="wireframe">
        <section class="registrarse">
            <header class="header-arriba">
                <section class="icono-registro">
                    <button id="flecha" onclick="location.href='2. index.html'" style="background: none; border: none; padding: 0; cursor: pointer;">
                        <img style="width: 1.875rem; height: 1.875rem;" src="./src/img/flecha.png" alt="Flecha"/>
                    </button>
                </section>
            </header>
            <section class="logo-registrarse">
                <img style="width: 10.25rem; height: 9.75rem" src="./src/img/PLANTA.png" />
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Nombre</p>
                </section>
                <input class="input-registro" id="input-nombre-registro" type="text" placeholder="Ej: Matías">
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Fecha de nacimiento</p>
                </section>
                <input class="input-registro" id="input-fecha-registro" type="date">
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Correo electrónico</p>
                </section>
                <input class="input-registro" id="input-mail-registro" type="email" placeholder="ejemplo@gmail.com">
            </section>
            <section class="campo-registro">
                <section class="etiqueta-registro">
                    <p>Contraseña</p>
                </section>
                <input class="input-registro" id="input-contrasena-registro" type="password" placeholder="••••••••">
            </section>
            <section class="boton-registro">
                <button class="Registrarme" onclick="registrarUsuario()">Registrarme</button>
            </section>
            <section class="texto-registro">
                <p class="texto-registro">¿Ya tenés cuenta? <a href="4. iniciar-sesion.html">Iniciá sesión</a></p>
            </section>
        </section>
    </main>
    <script src="src/registro.js" defer></script>
</body>
</html>
